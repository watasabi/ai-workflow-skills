name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PKG_NAME: ai-workflow-skills

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}

      - name: Install cross-linker (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          DIST="dist/${PKG_NAME}-${{ matrix.platform }}-${VERSION}"
          mkdir -p "${DIST}"
          cp "target/${{ matrix.target }}/release/${PKG_NAME}" "${DIST}/"
          tar -czf "${PKG_NAME}-${{ matrix.platform }}-${VERSION}.tar.gz" -C dist "$(basename "${DIST}")"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}-${{ matrix.platform }}
          path: ${{ env.PKG_NAME }}-${{ matrix.platform }}-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
